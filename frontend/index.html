<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://unpkg.com/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; }
    #globeViz { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <script>
    // 1. BULLETPROOF HANDSHAKE: Run this before touching the globe!
    function initializeStreamlit() {
        // If the Streamlit library hasn't finished downloading yet, wait 50ms and try again
        if (typeof Streamlit === 'undefined') {
            setTimeout(initializeStreamlit, 50);
            return;
        }
        
        // Tell Python we are alive immediately!
        Streamlit.setComponentReady();
        Streamlit.setFrameHeight(600);
        
        // Now it's safe to build the globe
        buildGlobe();
    }

    // 2. Build the 3D Globe
    function buildGlobe() {
        try {
            const globe = Globe()(document.getElementById('globeViz'))
              .showGlobe(true)
              .globeColor('rgb(15, 35, 65)') // Ocean Blue
              .backgroundColor('rgba(0,0,0,0)')
              .polygonAltitude(0.01)
              .polygonCapColor(() => 'rgb(28, 62, 42)') // Land Green
              .polygonSideColor(() => 'rgba(0,0,0,0)');

            // Fetch GeoJSON Data
            fetch('https://raw.githubusercontent.com/python-visualization/folium/master/examples/data/world-countries.json')
              .then(res => res.json())
              .then(data => {
                 const countries = data.features.filter(f => f.properties.name !== "Antarctica");
                 globe.polygonsData(countries);
              });

            // Handle Clicks
            globe.onPolygonClick((polygon, event, coords) => {
                Streamlit.setComponentValue({
                    country: polygon.properties.name,
                    lat: coords.lat,
                    lon: coords.lng
                });
            });

            globe.onGlobeClick(({ lat, lng }) => {
                Streamlit.setComponentValue({ country: null, lat: lat, lng: lng });
            });

            // Handle Python Updates
            function onRender(event) {
              if (!event.detail.args) return;
              const args = event.detail.args;
              
              if (args.show_borders) {
                  globe.polygonStrokeColor(() => 'white');
              } else {
                  globe.polygonStrokeColor(() => 'rgba(0,0,0,0)'); 
              }

              if (args.pin_lat !== null && args.pin_lon !== null) {
                  globe.labelsData([{ lat: args.pin_lat, lng: args.pin_lon, text: '📍' }])
                       .labelLat(d => d.lat)
                       .labelLng(d => d.lng)
                       .labelText(d => d.text)
                       .labelSize(5)
                       .labelColor(() => 'white')
                       .labelDotRadius(0.5);
              } else {
                  globe.labelsData([]);
              }
            }

            Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);

        } catch (error) {
            // Even if the globe crashes, the Streamlit app will NOT throw an error now.
            // You will just see a blank space, and we can check the browser console.
            console.error("Globe failed to build:", error);
        }
    }

    // Start the process
    initializeStreamlit();
  </script>
</body>
</html>
