<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; }
    #globeViz { width: 100vw; height: 100vh; position: relative; }
    /* Force the canvas three.js creates to actually fill its container,
       in case it was sized from a stale/zero measurement at creation time */
    #globeViz canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div id="globeError" style="display:none; color:#f66; font-family:sans-serif; padding:20px;"></div>
  <script>
    // ---- MINIMAL STREAMLIT COMPONENT PROTOCOL (From Claude) ----
    function sendToStreamlit(type, data) {
      const payload = Object.assign({ isStreamlitMessage: true, type: type }, data);
      window.parent.postMessage(payload, "*");
    }
    function componentReady() {
      sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    }
    function setFrameHeight(height) {
      sendToStreamlit("streamlit:setFrameHeight", { height: height });
    }
    function sendValue(value) {
      sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
    }

    // IMMEDIATELY tell Python we are alive to prevent timeouts!
    componentReady();
    setFrameHeight(600);

    const getCountryName = (d) => d.properties.ADMIN || d.properties.name;
    
    // ---- TRUE 3D WEBGL GLOBE LOGIC ----
    let globe;
    let isGlobeReady = false;
    let countriesData = []; // filled once the countries geojson loads; the
                             // message handler below needs this too, to
                             // look up a selected country's island shapes

    function initGlobe() {
        // Wait safely if the globe.gl library is still downloading over the network
        if (typeof Globe === 'undefined') {
            setTimeout(initGlobe, 50);
            return;
        }

        try {
            globe = Globe()(document.getElementById('globeViz'))
              .showGlobe(true)
              .globeImageUrl('./earth-highres.jpg') // The NASA Texture!
              .backgroundColor('rgba(0,0,0,0)')
              .polygonAltitude(0.0008)
              .polygonCapCurvatureResolution(1) // finer cap tessellation - hugs the sphere closely
                                                 // so large countries (Russia, Canada, etc.) don't
                                                 // sink below the surface at near-zero altitude
              .polygonCapColor(() => 'rgba(0,0,0,0)') // Completely transparent default land
              .polygonSideColor(() => 'rgba(0,0,0,0)')
              .polygonStrokeColor(() => 'rgba(0,0,0,0)');
          
            // Fetch 110m Optimized GeoJSON Data
            //fetch('https://raw.githubusercontent.com/python-visualization/folium/master/examples/data/world-countries.json')
            fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson')
              .then(res => res.json())
              .then(data => {
                 const countries = data.features.filter(f => f.properties.ADMIN !== "Antarctica");
                 countriesData = countries;
                 globe.polygonsData(countries);
              });

            // Handle Clicks with click_id
            globe.onPolygonClick((polygon, event, coords) => {
                sendValue({
                    country: polygon.properties.ADMIN,
                    lat: coords.lat,
                    lon: coords.lng,
                    click_id: Date.now() 
                });
            });

            globe.onGlobeClick(({ lat, lng }) => {
                sendValue({ 
                    country: null, 
                    lat: lat, 
                    lon: lng,
                    click_id: Date.now() 
                });
            });

            // Turn off the drifting/momentum effect
            globe.controls().enableDamping = false;
          
            isGlobeReady = true;

            // Defensive fix: three.js/globe.gl sizes its renderer from the
            // container's dimensions at the exact moment Globe() is called.
            // If the iframe hadn't finished being sized by Streamlit yet at
            // that instant, the canvas can end up locked at a stale/zero
            // resolution even though the container looks fine afterward.
            // Re-assert the real size now, shortly after, and on resize.
            function resyncGlobeSize() {
                const el = document.getElementById('globeViz');
                const w = el.clientWidth || window.innerWidth;
                const h = el.clientHeight || window.innerHeight;
                if (w > 0 && h > 0) {
                    globe.width(w).height(h);
                }
            }
            resyncGlobeSize();
            setTimeout(resyncGlobeSize, 300);
            setTimeout(resyncGlobeSize, 1000);
            window.addEventListener('resize', resyncGlobeSize);

        } catch (error) {
            console.error("Failed to build 3D globe:", error);
            showFrontendError("Failed to build the 3D globe: " + error.message);
        }
    }

    function showFrontendError(msg) {
        const el = document.getElementById('globeError');
        el.textContent = "⚠️ " + msg + " (see browser console for details)";
        el.style.display = 'block';
    }

    // One centroid per polygon - for a MultiPolygon (archipelago nations
    // like Kiribati, Indonesia, etc.) this gives one point per landmass
    // instead of a single country-wide centroid that could land in open
    // ocean between scattered islands. Simple ring-vertex averaging is
    // good enough for placing a small visual marker (not exact enough for
    // hit-testing, but that's not what this is used for).
    // Generates a closed ring of [lat, lng] points forming a circle of the
    // given real-world radius (km) around a center point, using proper
    // spherical destination-point math (not a flat lat/lng offset, which
    // would distort into an ellipse away from the equator).
    const EARTH_RADIUS_KM = 6371;
    function geoCircle(centerLat, centerLng, radiusKm, numPoints = 48) {
        const lat1 = centerLat * Math.PI / 180;
        const lon1 = centerLng * Math.PI / 180;
        const angularDist = radiusKm / EARTH_RADIUS_KM;
        const points = [];
        for (let i = 0; i <= numPoints; i++) {
            const bearing = (i / numPoints) * 2 * Math.PI;
            const lat2 = Math.asin(
                Math.sin(lat1) * Math.cos(angularDist) +
                Math.cos(lat1) * Math.sin(angularDist) * Math.cos(bearing)
            );
            const lon2 = lon1 + Math.atan2(
                Math.sin(bearing) * Math.sin(angularDist) * Math.cos(lat1),
                Math.cos(angularDist) - Math.sin(lat1) * Math.sin(lat2)
            );
            points.push([lat2 * 180 / Math.PI, lon2 * 180 / Math.PI]);
        }
        return points;
    }

    function polygonCentroids(geometry) {
        let polygons;
        if (geometry.type === 'MultiPolygon') {
            polygons = geometry.coordinates;
        } else if (geometry.type === 'Polygon') {
            polygons = [geometry.coordinates];
        } else {
            return [];
        }
        return polygons.map(polygon => {
            const ring = polygon[0]; // exterior ring; ignore holes for a centroid
            let sumLon = 0, sumLat = 0;
            let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
            for (const [lon, lat] of ring) {
                sumLon += lon;
                sumLat += lat;
                if (lon < minLon) minLon = lon;
                if (lon > maxLon) maxLon = lon;
                if (lat < minLat) minLat = lat;
                if (lat > maxLat) maxLat = lat;
            }
            // rough "how big does this look" proxy: the larger of the two
            // bounding-box spans, in degrees. Not a real geodesic area, but
            // good enough to tell a tiny atoll from a large landmass.
            const extentDeg = Math.max(maxLon - minLon, maxLat - minLat);
            return { lat: sumLat / ring.length, lng: sumLon / ring.length, extentDeg };
        });
    }

    // If globe.gl never loads (CDN blocked, offline, etc.) give up after
    // a while instead of retrying silently forever.
    let waitedMs = 0;
    const ORIGINAL_INIT = initGlobe;
    initGlobe = function () {
        if (typeof Globe === 'undefined') {
            waitedMs += 50;
            if (waitedMs > 8000) {
                showFrontendError("The globe.gl library never finished loading from unpkg.com.");
                return;
            }
            setTimeout(initGlobe, 50);
            return;
        }
        ORIGINAL_INIT();
    };

    // Start building the globe
    initGlobe();

    // ---- HANDLE DATA SENT FROM PYTHON ----
    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      
      const args = event.data.args || {};
      if (!isGlobeReady) return; // Safety check

      // 1. Swap the Background Texture!
      if (args.show_borders) {
          globe.globeImageUrl('./earth-highres-bordered.jpg');
      } else {
          globe.globeImageUrl('./earth-highres.jpg'); 
      }

      // 2. Highlight the Selected Country
      globe.polygonCapColor(d => {
          const name = getCountryName(d);
          if (args.show_borders) {
              if (args.selected_country && name === args.selected_country) {
                  return 'rgba(255, 215, 0, 0.6)'; // Gold for active guess
              }
              if (args.last_correct_country && name === args.last_correct_country) {
                  return 'rgba(50, 255, 50, 0.6)'; // Green for previous correct answer!
              }
          }
          return 'rgba(0,0,0,0)';
      });

      // 3. HTML overlay markers, fixed on-screen size regardless of zoom:
      // the click-location "x" pin, plus a gold dot on each small landmass
      // of the selected country. An archipelago nation (e.g. Kiribati) is a
      // MultiPolygon with one polygon per island/atoll, so a single
      // country-wide centroid would often land in open ocean between them -
      // instead we get one centroid per polygon, and only mark the ones
      // small enough to actually need help being seen (see SMALL_POLYGON
      // threshold below), so large countries don't get a distracting dot.
      const SMALL_POLYGON_MAX_EXTENT_DEG = 1; // tune this to taste
      const htmlPoints = [];

      if (!args.show_borders && args.pin_lat !== null && args.pin_lon !== null && args.pin_lat !== undefined) {
          htmlPoints.push({ kind: 'pin', lat: args.pin_lat, lng: args.pin_lon });
      }

      if (args.show_borders && args.selected_country) {
          const feature = countriesData.find(f => getCountryName(f) === args.selected_country);
          if (feature) {
              for (const c of polygonCentroids(feature.geometry)) {
                  if (c.extentDeg <= SMALL_POLYGON_MAX_EXTENT_DEG) {
                      htmlPoints.push({ kind: 'island', lat: c.lat, lng: c.lng });
                  }
              }
          }
      }

      globe.htmlElementsData(htmlPoints)
           .htmlLat(d => d.lat)
           .htmlLng(d => d.lng)
           .htmlElement(d => {
               const el = document.createElement('div');
               el.style.lineHeight = '1';
               el.style.transform = 'translate(-50%, -50%)';
               el.style.pointerEvents = 'none'; // let clicks pass through to the globe
               el.style.textShadow = '0 0 3px rgba(0,0,0,0.9)'; // stay visible on light land too
               if (d.kind === 'pin') {
                   el.textContent = '×';
                   el.style.color = 'white';
                   el.style.fontSize = '18px';
                   el.style.fontWeight = 'bold';
               } else {
                   el.textContent = '●';
                   el.style.color = '#FFD700'; // gold, matching the active-guess highlight color
                   el.style.fontSize = '13px';
               }
               return el;
           });
     
    });
  </script>
</body>
</html>
