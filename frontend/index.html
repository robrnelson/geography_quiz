<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
  }
  #wrap {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  svg {
    touch-action: none;
    cursor: grab;
  }
  svg.dragging {
    cursor: grabbing;
  }
  path.country {
    stroke-width: 0.4;
  }
</style>
</head>
<body>
<div id="wrap"><svg id="globe"></svg></div>
<script>
  // ---- minimal Streamlit component protocol (no build step / no npm) ----
  function sendToStreamlit(type, data) {
    const payload = Object.assign({ isStreamlitMessage: true, type: type }, data);
    window.parent.postMessage(payload, "*");
  }
  function componentReady() {
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  }
  function setFrameHeight(height) {
    sendToStreamlit("streamlit:setFrameHeight", { height: height });
  }
  function sendValue(value) {
    sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  // ---- state ----
  let countries = [];
  let landColor = "#3a7d44";
  let oceanColor = "#1b4f72";
  let highlightColor = "#f4d35e";
  let highlightId = null;
  let size = 600;
  let zoom = 1;              // persists across re-renders and drag, like rotation
  const MIN_ZOOM = 0.6;
  const MAX_ZOOM = 3.5;
  let R = 280;
  let cx = 300, cy = 300;

  function updateR() {
    R = size * 0.47 * zoom;
  }

  // rotation persists across re-renders (Streamlit re-sends args on every
  // app rerun, but this script keeps running in the same iframe, so we
  // only set an initial rotation once)
  let rotLambda = 0.4;   // radians
  let rotPhi = -0.35;    // radians

  const svg = document.getElementById("globe");
  const wrap = document.getElementById("wrap");
  let firstRender = true;

  function toXYZ(lonDeg, latDeg) {
    const lambda = (lonDeg * Math.PI) / 180 - rotLambda;
    const phi = (latDeg * Math.PI) / 180;
    const phi0 = rotPhi;
    const X = Math.cos(phi) * Math.sin(lambda);
    const Y = Math.cos(phi0) * Math.sin(phi) - Math.sin(phi0) * Math.cos(phi) * Math.cos(lambda);
    const Z = Math.sin(phi0) * Math.sin(phi) + Math.cos(phi0) * Math.cos(phi) * Math.cos(lambda);
    return [X, Y, Z];
  }

  function intersectAtHorizon(a, b) {
    const t = a[2] / (a[2] - b[2]);
    let X = a[0] + t * (b[0] - a[0]);
    let Y = a[1] + t * (b[1] - a[1]);
    const norm = Math.sqrt(X * X + Y * Y) || 1;
    return [X / norm, Y / norm, 0];
  }

  // Sutherland-Hodgman clip of a closed ring against the visible
  // hemisphere (Z >= 0), operating directly on rotated unit-sphere coords
  function clipRing(pts3d) {
    const out = [];
    const n = pts3d.length;
    if (n === 0) return out;
    for (let i = 0; i < n; i++) {
      const curr = pts3d[i];
      const prev = pts3d[(i - 1 + n) % n];
      const currIn = curr[2] >= 0;
      const prevIn = prev[2] >= 0;
      if (currIn) {
        if (!prevIn) out.push(intersectAtHorizon(prev, curr));
        out.push(curr);
      } else if (prevIn) {
        out.push(intersectAtHorizon(prev, curr));
      }
    }
    return out;
  }

  function ringToPathSegment(ring) {
    const pts3d = ring.map(([lon, lat]) => toXYZ(lon, lat));
    const clipped = clipRing(pts3d);
    if (clipped.length < 3) return "";
    let d = "";
    clipped.forEach((p, i) => {
      const x = (cx + R * p[0]).toFixed(1);
      const y = (cy - R * p[1]).toFixed(1);
      d += (i === 0 ? "M " : "L ") + x + " " + y + " ";
    });
    return d + "Z ";
  }

  function countryPathData(rings) {
    let d = "";
    for (const ring of rings) {
      d += ringToPathSegment(ring);
    }
    return d;
  }

  function redraw() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    svg.setAttribute("viewBox", "0 0 " + size + " " + size);
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);

    const ns = "http://www.w3.org/2000/svg";

    const ocean = document.createElementNS(ns, "circle");
    ocean.setAttribute("cx", cx);
    ocean.setAttribute("cy", cy);
    ocean.setAttribute("r", R);
    ocean.setAttribute("fill", oceanColor);
    ocean.setAttribute("data-id", "");
    ocean.setAttribute("class", "ocean");
    svg.appendChild(ocean);

    for (const c of countries) {
      const d = countryPathData(c.rings);
      if (!d) continue;
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", d);
      path.setAttribute("fill-rule", "evenodd");
      path.setAttribute("fill", c.id === highlightId ? highlightColor : landColor);
      path.setAttribute("stroke", c.id === highlightId ? highlightColor : landColor);
      path.setAttribute("class", "country");
      path.setAttribute("data-id", c.id);
      svg.appendChild(path);
    }
  }

  // ---- drag to rotate + click to answer ----
  let dragging = false;
  let dragMoved = 0;
  let lastX = 0, lastY = 0;
  let rafPending = false;
  const activePointers = new Map(); // pointerId -> {x, y}, for pinch-zoom
  let pinchStartDist = null;
  let pinchStartZoom = 1;

  function clampZoom(z) {
    return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
  }

  function scheduleRedraw() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      redraw();
    });
  }

  function pointerDistance() {
    const pts = Array.from(activePointers.values());
    if (pts.length < 2) return null;
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  svg.addEventListener("pointerdown", (e) => {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    svg.setPointerCapture(e.pointerId);

    if (activePointers.size === 2) {
      // starting a pinch gesture — stop treating this as a rotate-drag
      dragging = false;
      pinchStartDist = pointerDistance();
      pinchStartZoom = zoom;
    } else if (activePointers.size === 1) {
      dragging = true;
      dragMoved = 0;
      lastX = e.clientX;
      lastY = e.clientY;
      svg.classList.add("dragging");
    }
  });

  svg.addEventListener("pointermove", (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size === 2) {
      const dist = pointerDistance();
      if (pinchStartDist && dist) {
        zoom = clampZoom(pinchStartZoom * (dist / pinchStartDist));
        updateR();
        scheduleRedraw();
      }
      return;
    }

    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    lastX = e.clientX;
    lastY = e.clientY;

    rotLambda -= dx * 0.006;
    rotPhi += dy * 0.006;
    const limit = Math.PI / 2 - 0.01;
    if (rotPhi > limit) rotPhi = limit;
    if (rotPhi < -limit) rotPhi = -limit;

    scheduleRedraw();
  });

  function endDrag(e) {
    const wasSinglePointerClick = dragging && activePointers.size === 1 && dragMoved < 5;
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2) pinchStartDist = null;

    if (activePointers.size === 0) {
      dragging = false;
      svg.classList.remove("dragging");
    }

    // a "click" is a pointer-up with negligible movement, and no pinch
    // in progress. Pointer capture redirects event.target to the
    // capturing element, so we hit-test with elementFromPoint instead,
    // which reports whatever is actually visible under the cursor.
    if (wasSinglePointerClick) {
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const id = target && target.getAttribute ? target.getAttribute("data-id") : null;
      sendValue({ id: id ? id : null, nonce: Date.now() + Math.random() });
    }
  }

  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  svg.addEventListener(
    "wheel",
    (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      zoom = clampZoom(zoom * factor);
      updateR();
      scheduleRedraw();
    },
    { passive: false }
  );

  // ---- Streamlit render protocol ----
  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};

    countries = args.countries || [];
    landColor = args.land_color || landColor;
    oceanColor = args.ocean_color || oceanColor;
    highlightColor = args.highlight_color || highlightColor;
    highlightId = args.highlight_id || null;
    size = args.height || 600;
    updateR(); // recompute from current size, but keep the user's zoom level
    cx = size / 2;
    cy = size / 2;

    wrap.style.width = size + "px";
    wrap.style.height = size + "px";

    redraw();

    if (firstRender) {
      firstRender = false;
      setFrameHeight(size);
    }
  });

  componentReady();
</script>
</body>
</html>
