<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; }
    #globeViz { width: 100vw; height: 100vh; position: relative; }
    #globeViz canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div id="globeError" style="display:none; color:#f66; font-family:sans-serif; padding:20px;"></div>
  <script>
    // ---- MINIMAL STREAMLIT COMPONENT PROTOCOL ----
    function sendToStreamlit(type, data) {
      const payload = Object.assign({ isStreamlitMessage: true, type: type }, data);
      window.parent.postMessage(payload, "*");
    }
    function componentReady() {
      sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    }
    function setFrameHeight(height) {
      sendToStreamlit("streamlit:setFrameHeight", { height: height });
    }
    function sendValue(value) {
      sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
    }

    componentReady();
    setFrameHeight(600);

    const getCountryName = (d) => d.properties.ADMIN || d.properties.name;

    // Coarse pointer = touch-primary device (phones/tablets), a more
    // reliable signal than screen width or user-agent sniffing (a touch
    // laptop with a big screen should still get full quality; a narrow
    // desktop window shouldn't get downgraded).
    const isMobile = window.matchMedia('(pointer: coarse)').matches;

    // Two textures per look (normal/bordered): a full one for capable
    // devices, and a pre-shrunk one for mobile. Mobile GPUs commonly cap
    // WebGL's max texture size well below desktop (4096-8192px vs 16384),
    // so an oversized texture gets silently downsampled at the last
    // second using whatever crude resize the browser falls back to -
    // noticeably softer than deliberately downsizing with a good filter
    // ahead of time. See bake_borders.py / a simple PIL resize to produce
    // these two extra files if they don't exist yet.
    const TEXTURE_NORMAL = isMobile ? './earth-highres-mobile.jpg' : './earth-highres.jpg';
    const TEXTURE_BORDERED = isMobile ? './earth-highres-bordered-mobile.jpg' : './earth-highres-bordered.jpg';
    
    // ---- TRUE 3D WEBGL GLOBE LOGIC ----
    let globe;
    let isGlobeReady = false;
    let countriesData = []; 

    function initGlobe() {
        if (typeof Globe === 'undefined') {
            setTimeout(initGlobe, 50);
            return;
        }

        try {
            globe = Globe({
                // Antialiasing is a major GPU cost on weaker/high-DPI
                // devices for comparatively little visual gain (it only
                // smooths polygon edges, not the texture itself) - a widely
                // cited real-world finding (Stripe's globe engineering
                // write-up) when chasing exactly this kind of lag.
                rendererConfig: { antialias: !isMobile, alpha: true },
              })(document.getElementById('globeViz'))
              .showGlobe(true)
              .showAtmosphere(false)
              .globeImageUrl(TEXTURE_NORMAL) 
              .backgroundColor('rgba(0,0,0,0)')
              .polygonAltitude(0.0008)
              // Finer curvature tessellation keeps large countries (Russia,
              // Canada, etc.) from sinking below the surface at near-zero
              // altitude, but it applies to every one of the ~250 country
              // polygons, not just the big ones - a real triangle-count
              // cost on mobile GPUs. Trading a little of that visual
              // correctness for a lot of performance there.
              .polygonCapCurvatureResolution(isMobile ? 2 : 1)
              .polygonCapColor(() => 'rgba(0,0,0,0)')
              .polygonSideColor(() => 'rgba(0,0,0,0)')
              .polygonStrokeColor(() => 'rgba(0,0,0,0)');

            globe.renderer().setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.0 : 1.2));
          
            fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson')
              .then(res => res.json())
              .then(data => {
                 const countries = data.features.filter(f => f.properties.ADMIN !== "Antarctica");
                 countriesData = countries;
                 globe.polygonsData(countries);
              });

            globe.onPolygonClick((polygon, event, coords) => {
                sendValue({
                    country: polygon.properties.ADMIN,
                    lat: coords.lat,
                    lon: coords.lng,
                    click_id: Date.now() 
                });
            });

            globe.onGlobeClick(({ lat, lng }) => {
                sendValue({ 
                    country: null, 
                    lat: lat, 
                    lon: lng,
                    click_id: Date.now() 
                });
            });

            globe.controls().enableDamping = false;
            isGlobeReady = true;

            function resyncGlobeSize() {
                const el = document.getElementById('globeViz');
                const w = el.clientWidth || window.innerWidth;
                const h = el.clientHeight || window.innerHeight;
                if (w > 0 && h > 0) {
                    globe.width(w).height(h);
                }
            }
            resyncGlobeSize();
            setTimeout(resyncGlobeSize, 300);
            setTimeout(resyncGlobeSize, 1000);
            window.addEventListener('resize', resyncGlobeSize);

        } catch (error) {
            console.error("Failed to build 3D globe:", error);
            showFrontendError("Failed to build the 3D globe: " + error.message);
        }
    }

    function showFrontendError(msg) {
        const el = document.getElementById('globeError');
        el.textContent = "⚠️ " + msg + " (see browser console for details)";
        el.style.display = 'block';
    }

    const EARTH_RADIUS_KM = 6371;
    function geoCircle(centerLat, centerLng, radiusKm, numPoints = 48) {
        const lat1 = centerLat * Math.PI / 180;
        const lon1 = centerLng * Math.PI / 180;
        const angularDist = radiusKm / EARTH_RADIUS_KM;
        const points = [];
        for (let i = 0; i <= numPoints; i++) {
            const bearing = (i / numPoints) * 2 * Math.PI;
            const lat2 = Math.asin(
                Math.sin(lat1) * Math.cos(angularDist) +
                Math.cos(lat1) * Math.sin(angularDist) * Math.cos(bearing)
            );
            const lon2 = lon1 + Math.atan2(
                Math.sin(bearing) * Math.sin(angularDist) * Math.cos(lat1),
                Math.cos(angularDist) - Math.sin(lat1) * Math.sin(lat2)
            );
            points.push([lat2 * 180 / Math.PI, lon2 * 180 / Math.PI]);
        }
        return points;
    }

    function polygonCentroids(geometry) {
        let polygons;
        if (geometry.type === 'MultiPolygon') {
            polygons = geometry.coordinates;
        } else if (geometry.type === 'Polygon') {
            polygons = [geometry.coordinates];
        } else {
            return [];
        }
        return polygons.map(polygon => {
            const ring = polygon[0];
            let sumLon = 0, sumLat = 0;
            let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
            for (const [lon, lat] of ring) {
                sumLon += lon;
                sumLat += lat;
                if (lon < minLon) minLon = lon;
                if (lon > maxLon) maxLon = lon;
                if (lat < minLat) minLat = lat;
                if (lat > maxLat) maxLat = lat;
            }
            const extentDeg = Math.max(maxLon - minLon, maxLat - minLat);
            return { lat: sumLat / ring.length, lng: sumLon / ring.length, extentDeg };
        });
    }

    let waitedMs = 0;
    const ORIGINAL_INIT = initGlobe;
    initGlobe = function () {
        if (typeof Globe === 'undefined') {
            waitedMs += 50;
            if (waitedMs > 8000) {
                showFrontendError("The globe.gl library never finished loading from unpkg.com.");
                return;
            }
            setTimeout(initGlobe, 50);
            return;
        }
        ORIGINAL_INIT();
    };

    initGlobe();

    // ---- HANDLE DATA SENT FROM PYTHON ----
    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      
      const args = event.data.args || {};
      if (!isGlobeReady) return; 

      // 1. Swap the Background Texture
      if (args.show_borders) {
          globe.globeImageUrl(TEXTURE_BORDERED);
      } else {
          globe.globeImageUrl(TEXTURE_NORMAL); 
      }

      // 2. Highlight the Selected Country
      globe.polygonCapColor(d => {
          const name = getCountryName(d);
          if (args.last_correct_country && name === args.last_correct_country) {
              return 'rgba(50, 255, 50, 0.6)';  
          }
          if (args.show_borders && args.selected_country && name === args.selected_country) {
              return 'rgba(255, 215, 0, 0.6)'; 
          }
          return 'rgba(0,0,0,0)';
      });

      // 3. HTML overlay markers, Pins, and Arcs!
      const hasPin = args.pin_lat !== null && args.pin_lon !== null && args.pin_lat !== undefined;
      const isCityReveal = args.actual_lat !== null && args.actual_lat !== undefined;
      const htmlPoints = [];

      // Ensure any leftover rings are permanently cleared
      globe.ringsData([]);

      // A) City Mode Reveal 
      if (isCityReveal) {
          htmlPoints.push({ kind: 'city_guess', lat: args.pin_lat, lng: args.pin_lon });
          htmlPoints.push({ kind: 'city_actual', lat: args.actual_lat, lng: args.actual_lon });
          
          globe.arcsData([{
               startLat: args.pin_lat, startLng: args.pin_lon,
               endLat: args.actual_lat, endLng: args.actual_lon
          }])
          .arcStartLat(d => d.startLat)
          .arcStartLng(d => d.startLng)
          .arcEndLat(d => d.endLat)
          .arcEndLng(d => d.endLng)
          .arcColor(() => ['rgba(255, 50, 50, 0.8)', 'rgba(50, 255, 50, 0.8)']) 
          .arcDashLength(0.4)
          .arcDashGap(0.2)
          .arcDashAnimateTime(1500)
          .arcAltitudeAutoScale(0.3);
          
      } else {
          globe.arcsData([]); // clear arcs
          
          // B) Standard Country Mode Pins
          if (!args.show_borders && hasPin) {
              htmlPoints.push({ kind: 'pin', lat: args.pin_lat, lng: args.pin_lon });
          }
      }

      // C) Small Island Dots
      const SMALL_POLYGON_MAX_EXTENT_DEG = 1;
      if (args.show_borders && args.selected_country) {
          const feature = countriesData.find(f => getCountryName(f) === args.selected_country);
          if (feature) {
              for (const c of polygonCentroids(feature.geometry)) {
                  if (c.extentDeg <= SMALL_POLYGON_MAX_EXTENT_DEG) {
                      htmlPoints.push({ kind: 'island', lat: c.lat, lng: c.lng });
                  }
              }
          }
      }

      // Render all HTML elements dynamically
      globe.htmlElementsData(htmlPoints)
           .htmlLat(d => d.lat)
           .htmlLng(d => d.lng)
           .htmlElement(d => {
               const el = document.createElement('div');
               el.style.lineHeight = '1';
               el.style.transform = 'translate(-50%, -50%)';
               el.style.pointerEvents = 'none';
               el.style.textShadow = '0 0 3px rgba(0,0,0,0.9)';
               
               if (d.kind === 'pin') {
                   el.textContent = '×';
                   el.style.color = 'white';
                   el.style.fontSize = '18px';
                   el.style.fontWeight = 'bold';
               } else if (d.kind === 'island') {
                   el.textContent = '●';
                   el.style.color = '#FFD700';
                   el.style.fontSize = '13px';
               } else if (d.kind === 'city_guess') {
                   el.textContent = '❌';
                   el.style.color = '#ff3333';
                   el.style.fontSize = '20px';
               } else if (d.kind === 'city_actual') {
                   el.textContent = '⭐';
                   el.style.color = '#33ff33';
                   el.style.fontSize = '20px';
               }
               return el;
           });
     
    });
  </script>
</body>
</html>
