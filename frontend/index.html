<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; }
    #globeViz { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div id="globeError" style="display:none; color:#f66; font-family:sans-serif; padding:20px;"></div>
  <script>
    // ---- MINIMAL STREAMLIT COMPONENT PROTOCOL (From Claude) ----
    function sendToStreamlit(type, data) {
      const payload = Object.assign({ isStreamlitMessage: true, type: type }, data);
      window.parent.postMessage(payload, "*");
    }
    function componentReady() {
      sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    }
    function setFrameHeight(height) {
      sendToStreamlit("streamlit:setFrameHeight", { height: height });
    }
    function sendValue(value) {
      sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
    }

    // IMMEDIATELY tell Python we are alive to prevent timeouts!
    componentReady();
    setFrameHeight(600);

    // ---- TRUE 3D WEBGL GLOBE LOGIC ----
    let globe;
    let isGlobeReady = false;

    // globe.gl has no globeColor() accessor - the real API only takes a
    // texture URL via globeImageUrl(). Build a 1x1 solid-color canvas and
    // hand it in as a data URL to get a flat ocean color with no image
    // asset needed.
    function solidColorTexture(cssColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 2;
        canvas.height = 1;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = cssColor;
        ctx.fillRect(0, 0, 2, 1);
        return canvas.toDataURL();
    }

    function initGlobe() {
        // Wait safely if the globe.gl library is still downloading over the network
        if (typeof Globe === 'undefined') {
            setTimeout(initGlobe, 50);
            return;
        }

        try {
            globe = Globe()(document.getElementById('globeViz'))
              .showGlobe(true)
              .globeImageUrl(solidColorTexture('rgb(15, 35, 65)')) // Ocean Blue
              .backgroundColor('rgba(0,0,0,0)')
              .polygonAltitude(0.01)
              .polygonCapColor(() => 'rgb(28, 62, 42)') // Land Green
              .polygonSideColor(() => 'rgba(0,0,0,0)');

            // Fetch GeoJSON Data
            fetch('https://raw.githubusercontent.com/python-visualization/folium/master/examples/data/world-countries.json')
              .then(res => res.json())
              .then(data => {
                 const countries = data.features.filter(f => f.properties.name !== "Antarctica");
                 globe.polygonsData(countries);
              });

            // Handle Clicks
            globe.onPolygonClick((polygon, event, coords) => {
                sendValue({
                    country: polygon.properties.name,
                    lat: coords.lat,
                    lon: coords.lng
                });
            });

            globe.onGlobeClick(({ lat, lng }) => {
                sendValue({ country: null, lat: lat, lon: lng });
            });

            isGlobeReady = true;

        } catch (error) {
            console.error("Failed to build 3D globe:", error);
            showFrontendError("Failed to build the 3D globe: " + error.message);
        }
    }

    function showFrontendError(msg) {
        const el = document.getElementById('globeError');
        el.textContent = "⚠️ " + msg + " (see browser console for details)";
        el.style.display = 'block';
    }

    // If globe.gl never loads (CDN blocked, offline, etc.) give up after
    // a while instead of retrying silently forever.
    let waitedMs = 0;
    const ORIGINAL_INIT = initGlobe;
    initGlobe = function () {
        if (typeof Globe === 'undefined') {
            waitedMs += 50;
            if (waitedMs > 8000) {
                showFrontendError("The globe.gl library never finished loading from unpkg.com.");
                return;
            }
            setTimeout(initGlobe, 50);
            return;
        }
        ORIGINAL_INIT();
    };

    // Start building the globe
    initGlobe();

    // ---- HANDLE DATA SENT FROM PYTHON ----
    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      
      const args = event.data.args || {};
      if (!isGlobeReady) return; // Safety check

      // Update Borders
      if (args.show_borders) {
          globe.polygonStrokeColor(() => 'white');
      } else {
          globe.polygonStrokeColor(() => 'rgba(0,0,0,0)'); 
      }

      // Update Pin
      if (args.pin_lat !== null && args.pin_lon !== null && args.pin_lat !== undefined) {
          globe.labelsData([{ lat: args.pin_lat, lng: args.pin_lon, text: '📍' }])
               .labelLat(d => d.lat)
               .labelLng(d => d.lng)
               .labelText(d => d.text)
               .labelSize(5)
               .labelColor(() => 'white')
               .labelDotRadius(0.5);
      } else {
          globe.labelsData([]);
      }
    });
  </script>
</body>
</html>
